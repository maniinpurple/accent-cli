[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accent-cli"
version = "0.1.0"
description = "Personal accent coach: record speech, extract rhythm & prosody metrics, hand them to an AI coach."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
    "scipy>=1.11",
    "faster-whisper>=1.0.3",
    "praat-parselmouth>=0.4.4",
    "pyperclip>=1.8",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
accent-cli = "accent_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
